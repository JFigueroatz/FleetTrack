server {
    # Puerto sin privilegios: la imagen nginx-unprivileged corre como usuario no root.
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de seguridad que pidio ZAP (semana 6). connect-src permite la API en localhost:8080 (docker-compose / dev);
    # detras del reverse proxy de Ansible la API es mismo origen ('self').
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8080; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
