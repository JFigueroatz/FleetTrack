---
# Clona/actualiza el repo y levanta el stack con Docker Compose. Los secretos (.env) nunca se versionan:
# se copian desde un vault local o se piden por variable extra (-e postgres_password=...).
- name: Clonar o actualizar el repositorio FleetTrack
  ansible.builtin.git:
    repo: "{{ fleettrack_repo_url }}"
    dest: "{{ fleettrack_dir }}"
    version: "{{ fleettrack_repo_branch }}"
    force: true

- name: Generar .env a partir de las variables del vault/extra-vars
  ansible.builtin.template:
    src: env.j2
    dest: "{{ fleettrack_dir }}/.env"
    mode: "0600"
  no_log: true # evita imprimir secretos en el log de Ansible

- name: Construir y levantar el stack con Docker Compose
  ansible.builtin.command:
    cmd: docker compose up -d --build
    chdir: "{{ fleettrack_dir }}"
  changed_when: true

- name: Esperar a que la API responda
  ansible.builtin.uri:
    url: "http://localhost:8080/api/auth/login"
    method: POST
    body_format: json
    body: { email: "healthcheck@invalid", password: "x" }
    status_code: [400, 401, 404]
  register: api_health
  retries: 12
  delay: 5
  until: api_health.status is defined
