appId: com.companyname.fleettrack.mobile
---
# Flujo 8/8: finalizacion (camino feliz, con red). Inicia y finaliza una entrega y confirma el estado final en pantalla.
- runFlow: 03_iniciar_entrega.yaml
- tapOn: "Finalizar"
- assertVisible: "Entrega finalizada."
# El estado va dentro del texto de la fila ("1. Cliente ... - Completed"), por eso el patron lleva ".*".
- assertVisible: ".*Completed"
